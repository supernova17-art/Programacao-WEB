<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX01 - Selectors</title>
    <link rel="stylesheet" href="style01.css">
</head>
<body>
    <header id="topo">
        <h1>Aprender CSS</h1>
        <p class="introducao">Exemplo simples de seletores CSS.</p>
    </header>

    <main>
        <section class="conteudo">
            <h2>OLa chamo me thaniel</h2>
            <p>Gosto de jogar online</p>
            <a href="#">Consultar documentação</a>
        </section>

        <section class="conteudo">
            <h2>Lista de tópicos</h2>
            <ul>
                <li>Seletores</li>
                <li class="importante">Cores e fundos</li>
                <li>Espaçamentos</li>
            </ul>
        </section>

        <form>
            <label for="nome">O teu nome:</label>
            <input type="text" id="nome" placeholder="Escreve o teu nome">
            <button type="button">Enviar</button>
        </form>
    </main>
</body>
</html>
