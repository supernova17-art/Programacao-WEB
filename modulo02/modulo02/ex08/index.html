<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX08 - Dashboard</title>
    <link rel="stylesheet" href="style08.css">
</head>
<body>
    <div class="dashboard">
        <header class="cabecalho">
            <h1>Meu Dashboard</h1>
            <p>Painel de informação simples</p>
        </header>

        <aside class="menu">
            <h2>Menu</h2>
            <nav>
                <a href="#">Início</a>
                <a href="#">Estatísticas</a>
                <a href="#">Utilizadores</a>
                <a href="#">Definições</a>
            </nav>
        </aside>

        <main class="principal">
            <h2>Resumo</h2>

            <section class="cartoes">
                <article class="cartao">
                    <h3>Utilizadores</h3>
                    <p class="numero">125</p>
                </article>
                <article class="cartao">
                    <h3>Vendas</h3>
                    <p class="numero">48</p>
                </article>
                <article class="cartao">
                    <h3>Visitas</h3>
                    <p class="numero">860</p>
                </article>
            </section>

            <h2>Últimos registos</h2>
            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Atividade</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Ana</td>
                            <td>Registo</td>
                            <td>Concluído</td>
                        </tr>
                        <tr>
                            <td>Paulo</td>
                            <td>Compra</td>
                            <td>Pendente</td>
                        </tr>
                        <tr>
                            <td>Maria</td>
                            <td>Atualização</td>
                            <td>Concluído</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <footer class="rodape">
            <p>Dashboard de demonstração — 2026</p>
        </footer>
    </div>
</body>
</html>
